services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    privileged: false
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SYS_CHROOT
    cpus: '0.50'
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    environment:
      TMPDIR: /workspace/tmp
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    tmpfs:
      - /run:rw,nosuid,nodev,noexec,size=16m,mode=0755
      - /tmp:rw,nosuid,nodev,size=32m,mode=1777
    volumes:
      - type: bind
        source: /opt/merly-workspace-data
        target: /workspace
        bind:
          create_host_path: false
      # Explicit :ro syntax for SSH credentials and exported monitoring data.
      # Runtime mount flags MUST be checked after Coolify deploy.
      - /opt/merly-workspace-access/merly-agent.pub:/etc/ssh/authorized_keys/merly-agent:ro
      - /opt/merly-workspace-access/host_keys:/etc/ssh/host_keys:ro
      - /var/lib/merly-monitor-public:/monitor:ro
    networks:
      - merly_private
    expose:
      - '2222'
    healthcheck:
      test: ['CMD', 'python3', '-c', "import socket; s=socket.create_connection(('127.0.0.1',2222),2); s.close()"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '2'
networks:
  merly_private:
    external: true
    name: merly-agent-private
